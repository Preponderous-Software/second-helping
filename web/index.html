<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Second Helping</title>
<meta name="description" content="Walk a harvest fair, count the pie ballots by hand and learn how ranked choice voting works.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@700&family=Shrikhand&display=swap">
<link rel="stylesheet" href="game.css">
</head>
<body>
<canvas id="fair" tabindex="0" aria-label="A harvest fair in 3D. Walk with W A S D or the arrow keys, drag to look, and press E to use what is in front of you."></canvas>
<header id="hud" hidden>
  <div id="goal"><span id="day"></span><strong id="objective"></strong><span id="knocks" hidden></span></div>
  <div id="hud-buttons">
    <button id="assist" type="button" hidden>Bertie, finish this pile</button>
    <button id="ledger" type="button" hidden>Ledger</button>
    <button id="skip" type="button" hidden>Skip day</button>
    <button id="help" type="button" aria-label="Controls">?</button>
  </div>
</header>
<div id="toast" role="status" aria-live="polite" hidden></div>
<aside id="held" hidden aria-live="polite"></aside>
<div id="arrow" hidden aria-hidden="true"></div>
<button id="prompt" type="button" hidden></button>
<div id="stick" hidden aria-hidden="true"><div id="knob"></div></div>
<section id="panel" role="dialog" aria-labelledby="panel-title" hidden>
  <h2 id="panel-title"></h2>
  <div id="panel-body"></div>
  <div id="panel-buttons"></div>
</section>
<div id="fade" hidden aria-hidden="true"></div>
<section id="title" hidden>
  <div class="title-inner">
    <p class="eyebrow">A game about ranked choice voting</p>
    <h1>Second Helping</h1>
    <p>Four pies. Five days. Count the ballots yourself and see how ranked voting works, and where it breaks.</p>
    <div id="title-buttons"></div>
    <p class="keys desk">W A S D walk · Shift run · drag look · E use</p>
    <p class="keys touch">Stick walks · drag looks · button uses</p>
    <p class="more"><a href="https://play.danielstephenson.dev/">More games</a></p>
  </div>
</section>
<noscript><p>Second Helping needs JavaScript and WebGL 2.</p></noscript>
<script src="vendor/strata-loader.js"></script>
<script src="vendor/strata-kit.js"></script>
<script src="vendor/hall-walk.js"></script>
<script src="vendor/hall-controls.js"></script>
<script src="rules.js"></script>
<script src="scene.js"></script>
<script src="main.js"></script>
</body>
</html>
